<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ink Ripple</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0c10'/%3E%3Cg fill='none' stroke-width='2'%3E%3Ccircle cx='16' cy='16' r='4' stroke='%2360d0ff'/%3E%3Ccircle cx='16' cy='16' r='9' stroke='%2360d0ff' opacity='0.6'/%3E%3Ccircle cx='16' cy='16' r='13' stroke='%2360d0ff' opacity='0.3'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div id="ui">
      <h1>Ink Ripple</h1>
      <div class="row">
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="ripple">Ripples</option>
          <option value="trail">Flow Trail</option>
          <option value="fireworks">Fireworks</option>
        </select>
      </div>
      <div class="row">
        <label for="hue">Palette</label>
        <input type="range" id="hue" min="0" max="360" value="200" />
      </div>
      <div class="row">
        <label for="size">Brush Size</label>
        <input type="range" id="size" min="4" max="60" value="18" />
      </div>
      <div class="row buttons">
        <button id="clearBtn">Clear</button>
        <button id="saveBtn">Save PNG</button>
      </div>
      <p class="hint">Click / drag / touch the canvas to paint.</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
